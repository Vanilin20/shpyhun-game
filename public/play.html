<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Шпигун</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800;900&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top" id="top" hidden>
  <span class="brand">ШПИ<b>Г</b>УН</span>
  <span class="chip mono" id="codeChip"></span>
  <span class="chip theme" id="themeChip" hidden></span>
  <span class="grow"></span>
  <button class="btn small" id="chatBtn" aria-label="Чат">💬<span class="badge" id="chatBadge" hidden></span></button>
  <button class="btn small" id="roleBtn" hidden aria-label="Моя роль">🕵️ Роль</button>
  <span id="ringSlot"></span>
</header>
<main class="wrap" id="main"></main>
<div class="hostbar" id="hostbar" hidden><div class="inner"></div></div>
<div class="overlay" id="overlay" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-head"><b>Чат кімнати</b><button class="btn small" id="chatClose" aria-label="Закрити">✕</button></div>
  <div class="chat-list" id="chatList"></div>
  <form class="chat-form" id="chatForm"><input type="text" id="chatIn" maxlength="200" placeholder="Повідомлення…" autocomplete="off"><button class="btn primary small" type="submit">➤</button></form>
</div>
<script src="/qrcode.js"></script>
<script src="/common.js"></script>
<script>
// ===== Шпигун — телефон гравця =====
$('#ringSlot').innerHTML = Timer.html();
const urlRoom = (new URLSearchParams(location.search).get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
let SES = store.get('spy_session');           // { room, token, id }
let st = null, live = null, lastKey = '', drawSent = false, canvasApi = null, buzzed = '', confettiFor = '';

const api = (action, extra = {}) => postApi({ action, room: SES && SES.room, token: SES && SES.token, ...extra })
  .then(r => { if (r.error) toast(r.error); if (live) live.refresh(); return r; });
const P = id => R.P(st, id);
const me = () => st && st.me;

function shareLink() {
  const base = isLocalHost && st && st.lanUrls && st.lanUrls.length ? st.lanUrls[0] : location.origin + '/';
  return base + '?r=' + (st ? st.code : '');
}

// ---------- вхід ----------
async function boot() {
  if (SES && SES.room && (!urlRoom || urlRoom === SES.room)) {
    const ex = await fetch(`/exists?room=${SES.room}&t=${SES.token}`).then(r => r.json()).catch(() => null);
    if (ex && ex.ok && ex.player) return enter();
    if (!ex) return home("Немає зв'язку з сервером. Онови сторінку.");
    store.set('spy_session', null); SES = null;
  }
  if (urlRoom) return joinScreen(urlRoom);
  home();
}
function enter() {
  if (live) live.stop();
  lastKey = ''; st = null;
  history.replaceState(null, '', '/?r=' + SES.room);
  live = Live({
    room: SES.room, token: SES.token, onState,
    onNoRoom: () => { store.set('spy_session', null); SES = null; live = null; history.replaceState(null, '', '/'); home('Цієї кімнати вже немає. Створи нову або введи інший код.'); },
  });
}
function leave() {
  if (st && !['lobby', 'end'].includes(st.phase) && !confirm('Вийти з гри? Ти вибуваєш із цієї партії.' + (st.amHost ? ' Ведучим стане інший гравець.' : ''))) return;
  api('leave');
  if (live) { live.forget(); live.stop(); } live = null;
  store.set('spy_session', null); SES = null; st = null;
  history.replaceState(null, '', '/');
  home();
}
function chrome(inRoom) {
  $('#top').hidden = !inRoom;
  if (!inRoom) { $('#hostbar').hidden = true; $('#overlay').hidden = true; }
}

const RULES = `<details class="rules"><summary>Як грати</summary><ol>
  <li>Усі бачать <b>тему й локацію</b>, шпигун — лише <b>тему</b>.</li>
  <li><b>Імена по колу:</b> по черзі кожен вигадує персонажа з натяком на локацію — і бачить імена тих, хто вже назвався.</li>
  <li><b>Допит по колу:</b> кожен питає наступного гравця вголос — 2 хвилини на питання.</li>
  <li><b>Творчий раунд</b> (по черзі між партіями): малювання, предмети (обираєш і пояснюєш зв'язок з локацією) або сцена з 1–5 наліпок.</li>
  <li><b>Швидкий раунд</b> (теж по черзі): три емодзі, годинник (питання про час) або анонімні записки.</li>
  <li><b>Голосування.</b> Після нього шпигун має 30 секунд, щоб назвати локацію: вгадав — переміг, помилився — програв.</li>
  <li><b>Одне слово</b> і друге голосування.</li>
  <li>Від 7 гравців — <b>два шпигуни</b>, які знають одне одного. Мирним треба вигнати обох.</li>
  <li><b>Граєте не разом?</b> Ведучий вмикає «На відстані»: питання, відповіді й пояснення пишуться в грі, а для розмов є чат 💬.</li>
  <li><b>Рахунок:</b> перемога шпигуна — +2 кожному шпигуну, перемога мирних — +1 кожному мирному.</li></ol></details>`;

function home(msg) {
  chrome(false); lastKey = 'home';
  const saved = store.get('spy_name') || '';
  $('#main').innerHTML = `<div class="screen-in" style="display:grid;gap:18px;padding-top:3vh">
    <div class="center" style="display:grid;gap:14px;justify-items:center">
      <span class="stamp">Цілком таємно</span>
      <div class="brand big">ШПИ<b>Г</b>УН</div>
      <p class="muted" style="max-width:34ch">Серед вас шпигун. Він знає лише тему, а ви — ще й місце. Вичисліть його, поки він не здогадався.</p>
    </div>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ''}
    <input type="text" id="nameIn" maxlength="16" placeholder="Твоє ім'я" value="${esc(saved)}" autocomplete="off">
    <button class="btn primary wide" id="createBtn">Створити кімнату</button>
    <div class="divider">або</div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:10px">
      <input type="text" class="code-in" id="codeIn" maxlength="4" placeholder="КОД" autocomplete="off" autocapitalize="characters">
      <button class="btn" id="joinBtn">Увійти</button>
    </div>
    ${RULES}
    <a class="linkbtn center" href="/screen">Є ноутбук чи ТВ? Відкрий великий екран →</a>
  </div>`;
  const name = () => { const n = $('#nameIn').value.trim(); if (!n) { $('#nameIn').focus(); toast("Спершу введи ім'я"); } else store.set('spy_name', n); return n; };
  $('#createBtn').onclick = async () => {
    const n = name(); if (!n) return;
    $('#createBtn').disabled = true;
    const r = await postApi({ action: 'create', name: n, used: store.get('spy_used') || [] });
    if (r.error || !r.token) { $('#createBtn').disabled = false; return toast(r.error || 'Не вдалося створити кімнату'); }
    SES = { room: r.room, token: r.token, id: r.id }; store.set('spy_session', SES); enter();
  };
  const join = async () => {
    const code = $('#codeIn').value.toUpperCase().replace(/[^A-Z]/g, '');
    if (code.length !== 4) { $('#codeIn').focus(); return toast('Код кімнати — 4 літери'); }
    const n = name(); if (!n) return;
    doJoin(code, n);
  };
  $('#joinBtn').onclick = join;
  $('#codeIn').oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-ZА-ЯІЇЄҐ]/gi, ''); };
  $('#codeIn').onkeydown = e => { if (e.key === 'Enter') join(); };
}
async function doJoin(code, n) {
  const r = await postApi({ action: 'join', room: code, name: n });
  if (r.error) return r.noRoom ? home(r.error) : joinScreen(code, r.error);
  SES = { room: code, token: r.token, id: r.id }; store.set('spy_session', SES); enter();
}
function joinScreen(code, msg) {
  chrome(false); lastKey = 'join';
  const saved = store.get('spy_name') || '';
  $('#main').innerHTML = `<div class="screen-in" style="display:grid;gap:18px;padding-top:4vh">
    <div class="center" style="display:grid;gap:12px;justify-items:center">
      <div class="brand big">ШПИ<b>Г</b>УН</div>
      <span class="label">Тебе запросили в кімнату</span>
      <div class="code">${esc(code)}</div>
    </div>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ''}
    <input type="text" id="nameIn" maxlength="16" placeholder="Твоє ім'я" value="${esc(saved)}" autocomplete="off">
    <button class="btn primary wide" id="joinBtn">Увійти</button>
    <button class="linkbtn" id="otherBtn">Інша кімната</button>
  </div>`;
  const go = () => { const n = $('#nameIn').value.trim(); if (!n) return $('#nameIn').focus(); store.set('spy_name', n); doJoin(code, n); };
  $('#joinBtn').onclick = go;
  $('#nameIn').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#otherBtn').onclick = () => { history.replaceState(null, '', '/'); home(); };
  if (!saved) setTimeout(() => $('#nameIn').focus(), 300);
}

// ---------- стан ----------
function onState(v) {
  st = v; Timer.set(v);
  if (v.amHost && v.used) store.set('spy_used', v.used);
  if (!v.me) {
    if (v.phase === 'lobby') { if (live) live.stop(); live = null; store.set('spy_session', null); const c = SES.room; SES = null; return joinScreen(c, 'Тебе немає в кімнаті. Увійди ще раз.'); }
    chrome(true); $('#hostbar').hidden = true;
    if (lastKey !== 'spectate') { lastKey = 'spectate'; $('#main').innerHTML = `<div class="waiting screen-in" style="margin-top:10vh">Гра вже йде без тебе.<br>Зайдеш у наступну партію.</div>`; }
    return;
  }
  render();
}

// ---------- досьє ----------
function dossier() {
  const m = me();
  const body = m.isSpy
    ? `<div class="lbl">Роль</div><div class="val spyline">ТИ — ШПИГУН</div><div class="lbl">Тема</div><div class="val">${esc(st.theme)}</div>
       ${m.partners.length ? `<div class="lbl">Твій напарник</div><div class="val spyline">${m.partners.map(esc).join(', ')}</div>` : ''}
       <p style="font-weight:700">Локацію ${m.partners.length ? 'ви не знаєте' : 'ти не знаєш'}. Вдавай, що знаєш, і вгадай її.</p>`
    : `<div class="lbl">Тема</div><div class="val">${esc(st.theme)}</div><div class="lbl">Локація</div><div class="val">${esc(m.location)}</div>
       <p style="font-weight:700">${st.spies > 1 ? 'Серед вас ДВА шпигуни. Вони знають лише тему й знають одне одного.' : 'Серед вас шпигун. Він знає лише тему.'}</p>`;
  return `<div class="paper dossier" style="--rot:-1deg">${body}<span class="fingerprint">${m.isSpy ? '🕶️' : '🔎'}</span>
    <div class="cover"><div><span class="stamp">Цілком таємно</span><br>Натисни й тримай,<br>щоб прочитати</div></div></div>`;
}
function holdToReveal(el) {
  if (!el) return;
  const on = e => { e.preventDefault(); el.classList.add('open'); };
  const off = () => el.classList.remove('open');
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
$('#roleBtn').onclick = () => {
  const o = $('#overlay');
  o.innerHTML = dossier() + '<button class="btn ghost wide" id="ovLeave" style="margin-top:14px">Вийти з гри</button>';
  o.querySelector('#ovLeave').onclick = () => { o.hidden = true; leave(); };
  o.hidden = false;
  holdToReveal(o.querySelector('.dossier'));
  o.onclick = e => { if (e.target === o) o.hidden = true; };
};

// ---------- малювання ----------
function setupCanvas() {
  const cv = $('#cv'); if (!cv) return null;
  const W = 480; cv.width = W; cv.height = W;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, W); g.lineCap = 'round'; g.lineJoin = 'round';
  let color = '#1d1b18', size = 6, down = false, last = null, fill = false;
  // заливка: замкнена область кольору під пальцем (з допуском, щоб не лишались світлі краї)
  const flood = (x0, y0) => {
    x0 |= 0; y0 |= 0; if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= W) return;
    const img = g.getImageData(0, 0, W, W), d = img.data;
    const n = parseInt(color.slice(1), 16), nr = n >> 16, ng = (n >> 8) & 255, nb = n & 255;
    const i0 = (y0 * W + x0) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
    if (Math.abs(r0 - nr) + Math.abs(g0 - ng) + Math.abs(b0 - nb) < 10) return;
    const tol = 110, seen = new Uint8Array(W * W), stack = [y0 * W + x0];
    const like = k => { const i = k * 4; return Math.abs(d[i] - r0) + Math.abs(d[i + 1] - g0) + Math.abs(d[i + 2] - b0) <= tol; };
    const paint = k => { const i = k * 4; d[i] = nr; d[i + 1] = ng; d[i + 2] = nb; d[i + 3] = 255; };
    while (stack.length) {
      const k = stack.pop(); if (seen[k]) continue;
      let x = k % W; const y = (k / W) | 0, row = y * W;
      while (x > 0 && !seen[row + x - 1] && like(row + x - 1)) x--;
      let up = false, dn = false;
      for (; x < W && !seen[row + x] && like(row + x); x++) {
        const q = row + x; seen[q] = 1; paint(q);
        if (y > 0) { const a = q - W; if (!seen[a] && like(a)) { if (!up) { stack.push(a); up = true; } } else up = false; }
        if (y < W - 1) { const b = q + W; if (!seen[b] && like(b)) { if (!dn) { stack.push(b); dn = true; } } else dn = false; }
      }
    }
    g.putImageData(img, 0, 0);
  };
  const hist = [];
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; };
  cv.onpointerdown = e => {
    cv.setPointerCapture(e.pointerId);
    hist.push(g.getImageData(0, 0, W, W)); if (hist.length > 25) hist.shift();
    if (fill) { const p = pos(e); flood(p[0], p[1]); return; }
    down = true; last = pos(e);
    g.fillStyle = color; g.beginPath(); g.arc(last[0], last[1], size / 2, 0, 7); g.fill();
  };
  cv.onpointermove = e => {
    if (!down) return;
    const p = pos(e);
    g.strokeStyle = color; g.lineWidth = size;
    g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
    last = p;
  };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
  document.querySelectorAll('.sw').forEach(b => b.onclick = () => { color = b.dataset.c; document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
  const tools = [...document.querySelectorAll('.sz[data-s], #fill')];
  tools.forEach(b => b.onclick = () => { fill = b.id === 'fill'; if (!fill) size = +b.dataset.s; tools.forEach(x => x.classList.toggle('on', x === b)); });
  $('#undo').onclick = () => { const h = hist.pop(); if (h) g.putImageData(h, 0, 0); };
  $('#clear').onclick = () => { hist.push(g.getImageData(0, 0, W, W)); g.fillStyle = '#fff'; g.fillRect(0, 0, W, W); };
  return { data: () => cv.toDataURL('image/jpeg', .7) };
}

// ---------- сцена з наліпок: 1–5 емодзі, рухати, крутити, збільшувати + домальовувати ----------
let sceneApi = null, sceneSent = false;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function setupScene() {
  const cv = $('#sc'); if (!cv) return null;
  const W = 600; cv.width = W; cv.height = W;
  const g = cv.getContext('2d');
  const ink = document.createElement('canvas'); ink.width = W; ink.height = W;   // шар домальовок
  const gi = ink.getContext('2d'); gi.lineCap = 'round'; gi.lineJoin = 'round';
  const st = []; let sel = -1, mode = 'move', color = '#1d1b18';
  const ptrs = new Map(); let drag = null, gesture = null, lastPt = null;
  function draw(clean = false) {
    g.fillStyle = '#fbf6ea'; g.fillRect(0, 0, W, W);
    g.drawImage(ink, 0, 0);
    st.forEach((s, i) => {
      g.save(); g.translate(s.x, s.y); g.rotate(s.r);
      g.font = `${s.s}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(s.e, 0, s.s * .05);
      if (!clean && i === sel) { g.setLineDash([10, 8]); g.strokeStyle = '#e3412a'; g.lineWidth = 4; g.strokeRect(-s.s * .62, -s.s * .62, s.s * 1.24, s.s * 1.24); }
      g.restore();
    });
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; };
  const hit = (x, y) => { for (let i = st.length - 1; i >= 0; i--) { const s = st[i]; if (Math.hypot(x - s.x, y - s.y) < s.s * .65) return i; } return -1; };
  function tools() {
    const box = $('#seltools'); if (!box) return;
    box.hidden = mode !== 'move' || sel < 0;
    $('#pal').querySelectorAll('button').forEach(b => b.disabled = st.length >= 5);
    $('#scCount').textContent = `${st.length} / 5`;
    $('#send').disabled = !st.length;
  }
  cv.onpointerdown = e => {
    cv.setPointerCapture(e.pointerId);
    const p = pos(e); ptrs.set(e.pointerId, p);
    if (mode === 'draw') { lastPt = p; gi.strokeStyle = color; gi.lineWidth = 7; gi.beginPath(); gi.arc(p[0], p[1], 3.5, 0, 7); gi.fillStyle = color; gi.fill(); draw(); return; }
    if (ptrs.size === 2 && sel >= 0) {   // два пальці: масштаб і поворот
      const [a, b] = [...ptrs.values()]; const s = st[sel];
      gesture = { d: Math.hypot(b[0] - a[0], b[1] - a[1]), a: Math.atan2(b[1] - a[1], b[0] - a[0]), s: s.s, r: s.r }; drag = null; return;
    }
    const i = hit(p[0], p[1]); sel = i;
    if (i >= 0) { const s = st.splice(i, 1)[0]; st.push(s); sel = st.length - 1; drag = { dx: p[0] - s.x, dy: p[1] - s.y }; }
    draw(); tools();
  };
  cv.onpointermove = e => {
    if (!ptrs.has(e.pointerId)) return;
    const p = pos(e); ptrs.set(e.pointerId, p);
    if (mode === 'draw') { if (lastPt) { gi.beginPath(); gi.moveTo(lastPt[0], lastPt[1]); gi.lineTo(p[0], p[1]); gi.stroke(); lastPt = p; draw(); } return; }
    if (gesture && ptrs.size === 2 && sel >= 0) {
      const [a, b] = [...ptrs.values()], s = st[sel];
      s.s = Math.max(30, Math.min(360, gesture.s * Math.hypot(b[0] - a[0], b[1] - a[1]) / gesture.d));
      s.r = gesture.r + Math.atan2(b[1] - a[1], b[0] - a[0]) - gesture.a; draw(); return;
    }
    if (drag && sel >= 0) { const s = st[sel]; s.x = Math.max(0, Math.min(W, p[0] - drag.dx)); s.y = Math.max(0, Math.min(W, p[1] - drag.dy)); draw(); }
  };
  cv.onpointerup = cv.onpointercancel = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) gesture = null; if (!ptrs.size) { drag = null; lastPt = null; } };
  $('#pal').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (st.length >= 5) return toast('Максимум 5 наліпок');
    st.push({ e: b.dataset.e, x: W / 2 + (Math.random() - .5) * 120, y: W / 2 + (Math.random() - .5) * 120, s: 120, r: 0 });
    sel = st.length - 1; setMode('move'); draw(); tools();
  });
  const act = { rl: s => s.r -= Math.PI / 12, rr: s => s.r += Math.PI / 12, sm: s => s.s = Math.max(30, s.s / 1.2), bg: s => s.s = Math.min(360, s.s * 1.2) };
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    if (sel < 0) return;
    if (b.dataset.st === 'del') { st.splice(sel, 1); sel = -1; } else act[b.dataset.st](st[sel]);
    draw(); tools();
  });
  function setMode(m) {
    mode = m; if (m === 'draw') sel = -1;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('#inkcolors').hidden = m !== 'draw'; draw(); tools();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll('[data-ink]').forEach(b => b.onclick = () => { color = b.dataset.ink; document.querySelectorAll('[data-ink]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#inkClear').onclick = () => { gi.clearRect(0, 0, W, W); draw(); };
  draw(); tools();
  return { data: () => { draw(true); const d = cv.toDataURL('image/jpeg', .72); draw(); return d; }, count: () => st.length };
}

// ---------- годинник: 24-годинний циферблат під пальцем ----------
let clockAns = [];
function setupClock() {
  const box = $('#clockIn'); if (!box) return;
  clockAns = st.cq.map(c => (c.t === 'h' ? null : 3));
  const paint = () => {
    st.cq.forEach((c, i) => {
      const el = box.querySelector(`[data-ci="${i}"]`);
      if (c.t === 'h') { el.querySelector('.dialbox').innerHTML = R.dial([], 240, clockAns[i]).replace('class="dial"', 'class="dial input"'); el.querySelector('.val').textContent = clockAns[i] == null ? '--:--' : R.hhmm(clockAns[i]); }
      else el.querySelector('.val').textContent = R.SPANS[clockAns[i]];
    });
    $('#send').disabled = clockAns.some(x => x == null);
  };
  st.cq.forEach((c, i) => {
    const el = box.querySelector(`[data-ci="${i}"]`);
    if (c.t === 'h') {
      const db = el.querySelector('.dialbox');
      const set = e => {
        const r = db.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
        let a = Math.atan2(y, x) + Math.PI / 2; if (a < 0) a += 2 * Math.PI;
        clockAns[i] = ((Math.round(a / (2 * Math.PI) * 48) + 24) % 48) / 2; paint();
      };
      db.onpointerdown = e => { db.setPointerCapture(e.pointerId); set(e); db.onpointermove = set; };
      db.onpointerup = db.onpointercancel = () => { db.onpointermove = null; };
    } else el.querySelector('input').oninput = e => { clockAns[i] = +e.target.value; paint(); };
  });
  paint();
  $('#send').onclick = () => { if (clockAns.some(x => x == null)) return toast('Відповідай на всі 3 питання'); $('#send').disabled = true; api('clock', { ans: clockAns }); };
}

      if (m.verdict !== null) return `${R.phaseTag(s)}${wait(`Твоє рішення: <b>${m.verdict ? 'зарахувати' : 'не зараховувати'}</b>. Чекаємо інших…`)}`;
      return `${R.phaseTag(s)}<h1>Шпигун каже:</h1>
        <div class="paper" style="--rot:-1deg"><div class="lbl">Здогадка</div><div class="val">«${esc(s.guess)}»</div>
        <div class="lbl">Правильна локація</div><div class="val">${esc(m.location)}</div></div>
        <p class="muted">Чесно: це та сама локація?</p>
        <div class="row"><button class="btn primary" data-verdict="1">Так, вгадав</button><button class="btn" data-verdict="0">Ні</button></div>`;
    case 'words':
      if (!m.alive) return `${R.phaseTag(s)}${outBanner()}${wait('Інші пишуть слова…')}`;
      if (m.mine) return `${R.phaseTag(s)}<div class="paper" style="--rot:1deg"><div class="lbl">Твоє слово</div><div class="val">${esc(m.mine)}</div></div>${wait('Чекаємо інших…')}`;
      return `${R.phaseTag(s)}${notice()}<h1>Одне слово</h1>
        <p class="muted">${m.isSpy ? `Ти шпигун. Слово має пасувати до теми «${esc(s.theme)}».` : 'Одне слово про локацію. Не надто очевидне!'}</p>
        <input type="text" id="txt" maxlength="24" placeholder="Слово" autocomplete="off">
        <button class="btn primary wide" id="send">Готово</button><div id="dots"></div>`;
    case 'wordsReveal':
      return `${R.phaseTag(s)}<h1>Слова на стіл</h1>${R.words(s)}`;
    case 'end': {
      const e = s.end, spyWon = e.winner === 'spy', iWon = m.isSpy ? spyWon : !spyWon;
      return `<div class="end-hero"><span class="stamp big ${spyWon ? '' : 'green'}">${spyWon ? (e.spyIds.length > 1 ? 'Перемогли шпигуни' : 'Переміг шпигун') : 'Мирні перемогли'}</span>
        <h1>${iWon ? '🎉 Ти переміг!' : 'Цього разу — поразка'}</h1><p class="muted">${REASON[e.reason] || ''}</p></div>
        ${R.endReveal(s)}
        ${R.scores(s)}
        ${R.votes(s)}
        ${s.amHost ? R.settings(s) : ''}
        ${s.amHost ? '' : waiting(`Нову партію почне <b>${esc(P(s.hostId).name)}</b>`)}
        <button class="linkbtn" id="leaveBtn">Вийти з кімнати</button>`;
    }
  }
  return '';
}

// ---------- кнопки ведучого ----------
const REVEAL = ['namesReveal', 'drawReveal', 'itemsDone', 'emojiReveal', 'sceneReveal', 'clockReveal', 'notesReveal', 'voteResult', 'wordsReveal'];
function hostbarHtml() {
  const s = st;
  if (!s.amHost) return '';
  const tag = '<span class="tag">👑<br>ведучий</span>';
  if (s.phase === 'lobby') {
    const n = s.players.filter(p => p.online).length;
    return `${tag}<button class="btn primary" data-host="start" ${n < 3 ? 'disabled' : ''}>Почати гру · ${n}</button>`;
  }
  if (s.phase === 'end') return `${tag}<button class="btn" data-host="lobby">У лобі</button><button class="btn primary" data-host="start">Нова гра</button>`;
  if (REVEAL.includes(s.phase)) return `${tag}<button class="btn primary" data-host="next">Далі →</button>`;
  if (s.phase === 'verdict') return '';   // рішення мирних не пропускається
  const label = ['questions', 'items', 'names'].includes(s.phase) ? 'Пропустити хід' : 'Не чекати';
  return `${tag}<button class="btn ghost small" data-host="next">${label}</button>`;
}

// ---------- малювання екрана ----------
function render() {
  const s = st, m = me();
  chrome(true);
  $('#codeChip').textContent = s.code;
  $('#top').classList.toggle('ingame', s.phase !== 'lobby');
  const th = $('#themeChip'); th.hidden = !s.theme; th.textContent = s.theme || '';
  $('#roleBtn').hidden = ['lobby', 'end'].includes(s.phase) || (s.phase === 'roles' && !m.mine);
  if (s.phase !== 'drawing') { drawSent = false; canvasApi = null; }
  if (s.phase !== 'scene') { sceneSent = false; sceneApi = null; }
  if (['lobby', 'end'].includes(s.phase)) $('#overlay').hidden = true;

  const key = JSON.stringify([s.game, s.phase, s.stage, s.qi, s.idx, s.target, s.voteNo, s.notice, s.cands, s.hostId, s.amHost, m.alive, m.vote, m.verdict, !!m.mine, s.settings, s.players.map(p => p.score), Sound.on,
    s.phase === 'lobby' ? s.players.map(p => [p.id, p.name, p.online]) : 0, s.phase === 'items' ? s.items.map(i => [i.by, i.txt]) : 0, s.qa, s.named, s.res, s.end && s.end.reason]);
  if (key !== lastKey) {
    const keepFocus = document.activeElement && document.activeElement.id === 'txt' && lastKey && JSON.parse(lastKey)[1] === s.phase;
    lastKey = key;
    const typed = keepFocus ? $('#txt').value : null;
    $('#main').innerHTML = `<div class="screen-in" style="display:grid;gap:18px">${screenHtml()}</div>`;
    bind();
    if (typed != null && $('#txt')) { $('#txt').value = typed; $('#txt').focus(); }
    if (s.phase === 'end' && confettiFor !== s.game) {
      confettiFor = s.game;
      const spyWon = s.end.winner === 'spy';
      if (m.isSpy ? spyWon : !spyWon) confetti();
    }
  }
  // живі дрібниці без перемальовування
  const dots = $('#dots');
  if (dots) {
    const ids = s.phase === 'roles' || s.phase === 'names' ? s.players.map(p => p.id) : R.alive(s).map(p => p.id);
    dots.innerHTML = R.doneDots(s, ids);
  }
  const hb = hostbarHtml();
  $('#hostbar').hidden = !hb;
  const hk = hb + [s.game, s.phase, s.stage, s.qi, s.idx].join();   // новий хід — кнопка знову активна
  if (hb && $('#hostbar .inner').dataset.k !== hk) {
    $('#hostbar .inner').dataset.k = hk; $('#hostbar .inner').innerHTML = hb;
    $('#hostbar').querySelectorAll('[data-host]').forEach(b => b.onclick = () => { b.disabled = true; api(b.dataset.host); });
  }
  // вібрація, коли твій хід
  const cur = s.order ? s.order[s.idx] : null;
  const turn = (s.phase === 'questions' && (cur === m.id || (s.stage === 'ask' && s.target === m.id))) || (['items', 'names'].includes(s.phase) && cur === m.id) || (s.phase === 'guess' && m.isSpy);
  const tk = turn ? [s.game, s.phase, s.qi, s.idx, s.stage].join() : '';
  if (tk && tk !== buzzed) { buzzed = tk; buzz([80, 60, 80]); Sound.turn(); }
  Timer.tick();
  renderChat();
}

function bind() {
  const main = $('#main');
  main.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { b.disabled = true; api(b.dataset.act); });
  main.querySelectorAll('[data-target]').forEach(b => b.onclick = () => api('target', { target: b.dataset.target }));
  main.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => api('vote', { target: b.dataset.vote }));
  main.querySelectorAll('[data-verdict]').forEach(b => b.onclick = () => api('verdict', { yes: b.dataset.verdict === '1' }));
  main.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { buzz(30); api('pick', { index: +b.dataset.pick }); });
  main.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => api('kick', { target: b.dataset.kick }));
  R.bindSettings(main, st, api);
  if ($('#soundBtn')) $('#soundBtn').onclick = () => { Sound.toggle(); lastKey = ''; render(); };
  R.bindZoom(main);
  if (st.phase === 'roles') holdToReveal(main.querySelector('.dossier'));
  if ($('#leaveBtn')) $('#leaveBtn').onclick = leave;
  if ($('#copyBtn')) $('#copyBtn').onclick = () => {
    const link = shareLink();
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Посилання скопійовано')).catch(() => prompt('Скопіюй посилання:', link));
  };
  if ($('#shareBtn')) $('#shareBtn').onclick = () => {
    const link = shareLink();
    if (navigator.share) navigator.share({ title: 'Шпигун', text: `Заходь у гру «Шпигун», код кімнати ${st.code}`, url: link }).catch(() => {});
    else $('#copyBtn').click();
  };
  if (st.phase === 'drawing' && $('#cv')) { canvasApi = setupCanvas(); $('#send').onclick = sendDrawing; return; }
  if (st.phase === 'scene' && $('#sc')) { sceneApi = setupScene(); $('#send').onclick = sendScene; return; }
  if (st.phase === 'clock' && $('#clockIn')) { setupClock(); return; }
  const btn = $('#send'), txt = $('#txt');
  if (btn && txt && st.phase === 'emoji') {
    const seg = new Intl.Segmenter('uk', { granularity: 'grapheme' });
    const pick = () => [...seg.segment(txt.value)].map(x => x.segment).filter(g => /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g)).slice(0, 3);
    const upd = () => { const e = pick(); $('#slots').querySelectorAll('span').forEach((s, i) => { s.textContent = e[i] || ''; s.classList.toggle('on', !!e[i]); }); btn.disabled = e.length < 3; return e; };
    txt.oninput = upd; upd();
    const go = () => { const e = upd(); if (e.length === 3) { btn.disabled = true; api('emoji', { text: e.join(' ') }); } else toast('Потрібно 3 емодзі'); };
    btn.onclick = go; txt.onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  const rb = $('#rsend'), rt = $('#rtxt');
  if (rb && rt) {
    rt.focus();
    const go = () => { const t = rt.value.trim(); if (t) { rb.disabled = true; api(rb.dataset.a, { text: t }); } else rt.focus(); };
    rb.onclick = go; rt.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } };
  }
  if (btn && txt) {
    const action = { names: 'name', words: 'word', guess: 'guess' }[st.phase];
    const go = () => { const t = txt.value.trim(); if (t) { btn.disabled = true; api(action, { text: t }); } else txt.focus(); };
    btn.onclick = go;
    txt.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}

// малюнок здається сам за 2 секунди до кінця
setInterval(() => {
  if (st && st.phase === 'drawing' && me() && me().alive && !me().mine && canvasApi) {
    const l = Timer.left(); if (l != null && l <= 2000) sendDrawing();
  }
  if (st && st.phase === 'scene' && me() && me().alive && !me().mine && sceneApi && sceneApi.count()) {
    const l = Timer.left(); if (l != null && l <= 2000) sendScene();
  }
}, 300);

boot();

// ---------- чат кімнати ----------
let chatSeen = 0, chatOpen = false, chatDrawn = -1, chatHeard = -1;
function chatKey() { return 'spy_chat_seen_' + (SES && SES.room); }
function renderChat() {
  if (!st || !SES) return;
  const list = st.chat || [], m = me(), last = list.length ? list[list.length - 1].i : 0;
  if (!chatSeen) chatSeen = store.get(chatKey()) || 0;
  if (chatOpen && chatSeen !== last) { chatSeen = last; store.set(chatKey(), last); }
  const unread = list.filter(x => x.i > chatSeen && (!m || x.from !== m.id)).length;
  $('#chatBadge').hidden = !unread; $('#chatBadge').textContent = unread > 9 ? '9+' : unread;
  if (chatHeard >= 0 && last > chatHeard && list[list.length - 1].from !== (m && m.id)) { if (!chatOpen) buzz(30); Sound.chat(); }
  chatHeard = last;
  if (chatOpen && last !== chatDrawn) {
    const el = $('#chatList'), stick = chatDrawn < 0 || el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    el.innerHTML = list.length ? list.map(x => { const mine = m && x.from === m.id; return `<div class="msg ${mine ? 'me' : ''}">${mine ? '' : av({ name: x.who })}
      <div class="body">${mine ? '' : `<span class="who">${esc(x.who)}</span>`}<div class="txt">${esc(x.text)}</div></div></div>`; }).join('') : '<p class="muted center">Поки тихо. Напиши першим 👋</p>';
    if (stick) el.scrollTop = el.scrollHeight;
    chatDrawn = last;
  }
}
function setChat(on) {
  chatOpen = on; $('#chat').hidden = !on; chatDrawn = -1;
  if (on) { renderChat(); setTimeout(() => $('#chatIn').focus(), 50); }
}
$('#chatBtn').onclick = () => setChat(!chatOpen);
$('#chatClose').onclick = () => setChat(false);
$('#chatForm').onsubmit = e => {
  e.preventDefault();
  const t = $('#chatIn').value.trim(); if (!t) return;
  $('#chatIn').value = '';
  api('chat', { text: t }).then(r => { if (r && r.error) { toast(r.error); $('#chatIn').value = t; } });
};
</script>
</body>
</html>
