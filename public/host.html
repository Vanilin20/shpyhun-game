<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шпигун</title>
<style>
  /* Нуар-досьє: темний кабінет, жовтуватий папір, червона печатка */
  :root {
    --bg: #10141c; --panel: #181e29; --line: #2a3242;
    --fg: #eef1f6; --muted: #8d97a8;
    --paper: #ece0c4; --paper-ink: #24201a;
    --red: #d2442f; --ok: #6cc37a;
    --display: "Courier New", Consolas, monospace;
    --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 0%, #1b2231 0%, var(--bg) 60%); color: var(--fg); font: 18px/1.45 var(--body);
         display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  header { display: flex; align-items: center; gap: 20px; padding: 18px 32px; border-bottom: 1px solid var(--line); }
  .logo { font: 700 28px var(--display); letter-spacing: .35em; color: var(--paper); }
  .logo b { color: var(--red); }
  .theme { padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; font-size: 17px; color: var(--muted); }
  .theme span { color: var(--paper); font-weight: 600; }
  .grow { flex: 1; }
  .timer { font: 700 34px var(--display); min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--red); }
  main { display: grid; place-items: center; padding: 24px 32px; overflow: auto; }
  .stage { width: min(1200px, 100%); display: grid; gap: 22px; justify-items: center; text-align: center; }
  h1 { font: 700 clamp(34px, 5vw, 64px)/1.1 var(--display); letter-spacing: .04em; margin: 0; text-wrap: balance; }
  h2 { font: 600 26px/1.25 var(--body); margin: 0; color: var(--muted); text-wrap: balance; }
  .hint { color: var(--muted); max-width: 60ch; margin: 0; }
  .notice { background: rgba(210,68,47,.14); border: 1px solid rgba(210,68,47,.5); color: #ffb3a6; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
  footer { display: flex; align-items: center; gap: 10px; padding: 14px 32px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .chip.done .dot { background: var(--ok); }
  .chip.out { opacity: .45; text-decoration: line-through; }
  .chip.off { opacity: .5; }
  .chip small { color: var(--muted); }
  button { font: 600 18px var(--body); border-radius: 10px; border: 0; padding: 14px 26px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
  .primary { background: var(--red); color: #fff; }
  .primary:disabled { opacity: .4; cursor: default; }
  .ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .actions { display: flex; gap: 12px; margin-left: auto; }

  /* лобі */
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: center; text-align: left; width: min(1050px, 100%); }
  .qr { background: #fff; padding: 4px; border-radius: 14px; line-height: 0; }
  .qr svg { width: 300px; height: 300px; }
  .url { font: 600 20px var(--display); color: var(--paper); margin-top: 12px; text-align: center; word-break: break-all; }
  .linkbtn { background: none; color: var(--muted); padding: 6px; font-size: 14px; text-decoration: underline; width: 100%; }
  .plist { display: grid; gap: 8px; margin: 18px 0 22px; }
  .prow { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 20px; }
  .prow .x { margin-left: auto; background: none; color: var(--muted); padding: 2px 8px; font-size: 22px; }
  .netbtn { width: 100%; margin-top: 10px; padding: 10px 14px; font-size: 16px; }
  .net { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; text-align: center; color: var(--muted); max-width: 330px; }
  .net.on { color: var(--ok); border-color: rgba(108,195,122,.5); }
  .net.warn { color: #ffb3a6; border-color: rgba(210,68,47,.5); line-height: 1.5; }
  .net .why { display: block; margin-top: 6px; font: 13px/1.4 var(--display); color: var(--muted); overflow-wrap: anywhere; }
  .net code { background: var(--panel); padding: 2px 6px; border-radius: 4px; color: var(--paper); font-size: 14px; }
  .code { font: 600 18px var(--display); color: var(--muted); letter-spacing: .08em; margin-bottom: 6px; }
  .code b { color: var(--paper); font-size: 30px; letter-spacing: .25em; margin-left: 8px; }
  .rules { color: var(--muted); font-size: 15px; margin: 0; padding-left: 18px; }

  /* картки */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; width: 100%; }
  .card { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align: left; position: relative; }
  .card .who { font: 700 13px var(--display); letter-spacing: .15em; text-transform: uppercase; opacity: .6; }
  .card .big { font: 700 26px/1.2 var(--body); margin-top: 6px; overflow-wrap: anywhere; }
  .card.out { opacity: .45; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; display: block; margin-top: 8px; background: #fff; }
  .card.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { transform: scale(.85) rotate(-2deg); opacity: 0; } }

  .duel { display: flex; align-items: center; gap: 28px; font: 700 clamp(40px, 6vw, 80px)/1 var(--display); }
  .duel .arrow { color: var(--red); }
  .order { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .order span { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 15px; }
  .order span.cur { border-color: var(--red); color: var(--fg); }
  .order span.past { opacity: .4; }

  .items { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; width: 100%; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px; display: grid; gap: 4px; justify-items: center; }
  .item .e { font-size: 46px; line-height: 1.1; }
  .item .n { font-size: 15px; }
  .item.taken { background: var(--paper); color: var(--paper-ink); border-color: var(--paper); }
  .item .by { font: 700 13px var(--display); letter-spacing: .08em; color: var(--red); min-height: 1.2em; }

  .bars { display: grid; gap: 10px; width: min(640px, 100%); }
  .bar { display: grid; grid-template-columns: 160px 1fr 40px; align-items: center; gap: 12px; text-align: left; font-size: 20px; }
  .bar .fill { height: 22px; background: var(--red); border-radius: 4px; transition: width .6s; }
  .bar .track { background: var(--panel); border-radius: 4px; }

  .stamp { display: inline-block; font: 700 clamp(40px, 6vw, 76px)/1 var(--display); letter-spacing: .08em; padding: 14px 28px; border: 6px solid currentColor; border-radius: 10px; transform: rotate(-4deg); }
  .stamp.spy { color: var(--red); }
  .stamp.town { color: var(--ok); }
  .reveal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: min(1000px, 100%); }

  @media (max-width: 800px) { .lobby { grid-template-columns: 1fr; } .items { grid-template-columns: repeat(3, 1fr); } .reveal { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .card.pop { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">ШПИ<b>Г</b>УН</div>
  <div class="theme" id="theme" hidden>Тема: <span></span></div>
  <div class="grow"></div>
  <div class="timer" id="timer"></div>
</header>
<main><div class="stage" id="stage"><h2>Під'єднання…</h2></div></main>
<footer id="footer"></footer>
<script src="/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ROOM = '', KEY = '';   // кімната ведучого (зберігається в браузері)
let st = null, off = 0, urlIdx = 0, lastKey = '';
const LS = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

const act = (action, extra = {}) => fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, room: ROOM, key: KEY, ...extra }) })
  .then(r => r.json()).then(r => { if (r.error) alert(r.error); if (pollTimer) pollOnce(); }).catch(() => {});
const P = id => (st.players.find(p => p.id === id) || { name: '?' });
const alivePl = () => st.players.filter(p => p.alive);

let es = null;
const STATE_URL = () => `/state?room=${ROOM}&host=1&key=${KEY}`;
// живе оновлення: SSE, а якщо проксі його гальмує — опитування кожні 1.5 с
let lastAct = 0, gotAny = false, connAt = 0, pollTimer = null;
function onState(v) {
  gotAny = true; lastAct = Date.now();
  if (v.noRoom) return newRoom();             // сервер перезапускався — створюємо нову кімнату
  st = v; off = st.now - Date.now();
  if (v.used) LS.set('spy_used', v.used);       // пам'ять зіграних локацій
  render();
}
function pollOnce() { return fetch(STATE_URL()).then(r => r.json()).then(onState).catch(() => {}); }
function startPoll() { if (es) { es.close(); es = null; } if (!pollTimer) { pollTimer = setInterval(pollOnce, 1500); pollOnce(); } }
setInterval(() => {
  if (pollTimer) return;
  if ((!gotAny && connAt && Date.now() - connAt > 6000) || (gotAny && Date.now() - lastAct > 40000)) startPoll();
}, 2000);
async function newRoom() {
  if (es) { es.close(); es = null; }
  const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create', used: LS.get('spy_used') || [] }) }).then(r => r.json()).catch(() => ({}));
  if (!r.room) { $('#stage').innerHTML = `<h2>Не вдалося створити кімнату. Оновлюю…</h2>`; return setTimeout(newRoom, 3000); }
  ROOM = r.room; KEY = r.key; LS.set('spy_host', { room: ROOM, key: KEY });
  lastKey = ''; connect();
}
async function boot() {
  const saved = LS.get('spy_host');
  if (saved && saved.room) {
    const ok = await fetch(`/exists?room=${saved.room}&key=${saved.key}`).then(r => r.json()).then(r => r.ok).catch(() => false);
    if (ok) { ROOM = saved.room; KEY = saved.key; return connect(); }
  }
  newRoom();
}
function connect() {
  connAt = Date.now();
  if (pollTimer) { pollOnce(); return; }
  es = new EventSource(`/events?room=${ROOM}&host=1&key=${KEY}`);
  es.onmessage = e => onState(JSON.parse(e.data));
  es.addEventListener('ping', () => { lastAct = Date.now(); });
}
function left() { return st && st.endsAt ? Math.max(0, Math.ceil((st.endsAt - Date.now() - off) / 1000)) : null; }
function tick() {
  const l = left(), t = $('#timer');
  t.textContent = l == null ? '' : `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`;
  t.classList.toggle('low', l != null && l <= 10);
}
setInterval(tick, 250);

const REASON = {
  caught: 'Шпигуна вигнали, а локацію він не назвав',
  wrong: 'Шпигун назвав неправильну локацію',
  guessed: 'Шпигун вгадав локацію!',
  survived: 'Шпигун пережив обидва голосування',
  fewLeft: 'Лишилося двоє гравців — шпигун перемагає',
};

function nextBtn(label) { return `<button class="primary" onclick="act('next')">${label}</button>`; }
function waitBtn() { return `<button class="ghost" onclick="act('next')">Не чекати</button>`; }

function view() {
  const s = st, cur = s.order ? s.order[s.idx] : null;
  switch (s.phase) {
    case 'lobby': {
      const bases = isLocal && (s.lanUrls || []).length ? s.lanUrls : [location.origin + '/play'];
      const urls = bases.map(b => b + '?r=' + s.code), url = urls[urlIdx % urls.length] || '';
      let qr = '';
      try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({ cellSize: 6, margin: 24, scalable: true }); } catch (e) { qr = ''; }
      const online = s.players.filter(p => p.online);
      return { html: `
        <div class="lobby">
          <div>
            <div class="qr">${qr}</div>
            <div class="url">${esc(url.replace(/^https?:\/\//, ''))}</div>
            ${urls.length > 1 ? `<button class="linkbtn" onclick="urlIdx++;lastKey='';render()">Телефони не відкривають? Інша адреса</button>` : ''}
          </div>
          <div>
            <div class="code">Код кімнати <b>${esc(s.code)}</b></div>
            <h1>Скануйте QR</h1>
            <p class="hint">${isLocal ? 'Телефони мають бути в тій самій Wi-Fi мережі, що й ноутбук.' : 'Заходьте з будь-якої мережі, хоч з мобільного інтернету. Або відкрийте сайт гри й введіть код кімнати.'}</p>
            <div class="plist">${s.players.length ? s.players.map(p => `
              <div class="prow" style="${p.online ? '' : 'opacity:.5'}">🕵️ ${esc(p.name)}${p.online ? '' : ' <small>(не на зв\'язку)</small>'}
                <button class="x" title="Прибрати" onclick="act('kick',{target:'${p.id}'})">×</button></div>`).join('') : '<p class="hint">Поки нікого…</p>'}</div>
            <button class="primary" ${online.length < 3 ? 'disabled' : ''} onclick="act('start')">Почати гру (${online.length})</button>
            <ul class="rules" style="margin-top:22px">
              <li>Усі знають тему й локацію, шпигун — лише тему.</li>
              <li>Імена → питання → малювання або предмети → голосування → одне слово → голосування.</li>
              <li>Після кожного голосування шпигун може назвати локацію. Помилився — програв.</li>
            </ul>
          </div>
        </div>`, key: 'lobby' + JSON.stringify(s.players) + urlIdx + s.code + (s.lanUrls || []).join() };
    }
    case 'roles':
      return { html: `<h1>Подивіться на свої телефони</h1><h2>Там ваша роль. Не показуйте її іншим.</h2>`, act: waitBtn() };
    case 'names':
      return { html: `<h1>Придумайте ім'я персонажа</h1><p class="hint">Ім'я має натякати, що ви знаєте локацію, але не видавати її шпигуну.</p>`, act: waitBtn() };
    case 'namesReveal':
      return { html: `<h1>Хто тут зібрався?</h1><div class="cards">${s.players.map((p, i) => `
        <div class="card pop" style="animation-delay:${i * .12}s"><div class="who">${esc(p.name)}</div><div class="big">${esc(p.char)}</div></div>`).join('')}</div>`,
        act: nextBtn('До питань') };
    case 'questions': {
      const ord = `<div class="order">${s.order.map((id, i) => `<span class="${i === s.idx ? 'cur' : i < s.idx ? 'past' : ''}">${esc(P(id).name)}</span>`).join('')}</div>`;
      if (s.stage === 'pick') return { html: `<h2>Питання по колу</h2><h1>${esc(P(cur).name)} обирає, кого спитати</h1>${ord}`, act: waitBtn() };
      return { html: `<h2>Питання й відповідь — уголос</h2><div class="duel"><span>${esc(P(cur).name)}</span><span class="arrow">➜</span><span>${esc(P(s.target).name)}</span></div>${ord}`, act: nextBtn('Наступне питання') };
    }
    case 'drawing':
      return { html: `<h1>Малюємо локацію</h1><p class="hint">Кожен малює на телефоні. Потім усі малюнки з'являться тут разом.</p>`, act: waitBtn() };
    case 'drawReveal':
      return { html: `<h1>Галерея</h1><div class="cards">${alivePl().map((p, i) => `
        <div class="card pop" style="animation-delay:${i * .15}s"><div class="who">${esc(p.name)} · ${esc(p.char)}</div>
        ${s.drawings && s.drawings[p.id] ? `<img src="${s.drawings[p.id]}" alt="Малюнок ${esc(p.name)}">` : '<div class="big">не встиг 🙈</div>'}</div>`).join('')}</div>`,
        act: nextBtn('До голосування') };
    case 'items':
    case 'itemsDone': {
      const grid = `<div class="items">${s.items.map(it => `
        <div class="item ${it.by ? 'taken' : ''}"><div class="e">${it.e}</div><div class="n">${esc(it.n)}</div><div class="by">${it.by ? esc(P(it.by).name) : ''}</div></div>`).join('')}</div>`;
      if (s.phase === 'itemsDone') return { html: `<h1>Предмети розібрано</h1>${grid}`, act: nextBtn('До голосування') };
      const mine = s.items.find(it => it.by === cur && s.stage === 'explain');
      const head = s.stage === 'pick'
        ? `<h1>${esc(P(cur).name)} обирає предмет</h1>`
        : `<h1>${esc(P(cur).name)}: ${mine ? mine.e + ' ' + esc(mine.n) : ''}</h1><h2>Поясни вголос, як це пов'язано з локацією</h2>`;
      return { html: head + grid, act: s.stage === 'pick' ? waitBtn() : nextBtn('Наступний') };
    }
    case 'vote':
      return { html: `${s.notice ? `<div class="notice">${esc(s.notice)}</div>` : ''}<h1>Голосування ${s.voteNo === 2 ? '№2' : ''}</h1>
        <h2>Хто шпигун? Голосуйте на телефонах.</h2>`, act: waitBtn() };
    case 'voteResult': {
      const r = s.res || { counts: {} };
      const max = Math.max(1, ...Object.values(r.counts));
      const rows = s.players.filter(p => p.alive || p.id === r.out).map(p => {
        const c = r.counts[p.id] || 0;
        return `<div class="bar"><span>${esc(p.name)}</span><div class="track"><div class="fill" style="width:${c / max * 100}%"></div></div><b>${c}</b></div>`;
      }).join('');
      return { html: `<h1>${r.out ? `Вигнали: ${esc(P(r.out).name)}` : 'Нікого не вигнали'}</h1><div class="bars">${rows}</div>
        <p class="hint">Хто він насправді, дізнаємося пізніше.</p>`, act: nextBtn('Далі') };
    }
    case 'guess':
      return { html: `<h1>Шанс шпигуна</h1><h2>Шпигун може зараз назвати локацію. Вгадає — переможе. Помилиться — програє.</h2>` };
    case 'verdict':
      return { html: `<h2>Шпигун каже:</h2><h1>«${esc(s.guess)}»</h1><h2>Мирні вирішують на телефонах, чи це правильно</h2>`, act: waitBtn() };
    case 'words':
      return { html: `${s.notice ? `<div class="notice">${esc(s.notice)}</div>` : ''}<h1>Одне слово</h1><h2>Напишіть на телефоні одне слово про локацію</h2>`, act: waitBtn() };
    case 'wordsReveal':
      return { html: `<h1>Слова</h1><div class="cards">${alivePl().map((p, i) => `
        <div class="card pop" style="animation-delay:${i * .12}s"><div class="who">${esc(p.name)}</div><div class="big">${esc((s.words || {})[p.id] || '—')}</div></div>`).join('')}</div>`,
        act: nextBtn('До голосування') };
    case 'end': {
      const e = s.end, spy = P(e.spyId);
      return { html: `
        <div class="stamp ${e.winner}">${e.winner === 'spy' ? 'ПЕРЕМІГ ШПИГУН' : 'МИРНІ ПЕРЕМОГЛИ'}</div>
        <h2>${REASON[e.reason] || ''}</h2>
        <div class="reveal">
          <div class="card"><div class="who">Тема</div><div class="big">${esc(s.theme)}</div></div>
          <div class="card"><div class="who">Локація</div><div class="big">${esc(e.location)}</div></div>
          <div class="card"><div class="who">Шпигун</div><div class="big">${esc(spy.name)}</div>${spy.char ? `<div>«${esc(spy.char)}»</div>` : ''}</div>
        </div>
        ${e.guess ? `<p class="hint">Здогадка шпигуна: «${esc(e.guess)}»</p>` : ''}`,
        act: `<button class="ghost" onclick="act('lobby')">У лобі</button><button class="primary" onclick="act('start')">Нова гра</button>` };
    }
  }
  return { html: '' };
}

function footer() {
  if (!st || st.phase === 'lobby') return '';
  const done = new Set(st.done || []);
  return st.players.map(p => `<div class="chip ${done.has(p.id) ? 'done' : ''} ${p.alive ? '' : 'out'} ${p.online ? '' : 'off'}">
    <span class="dot"></span>${esc(p.name)}${p.char ? ` <small>${esc(p.char)}</small>` : ''}</div>`).join('');
}

function render() {
  if (!st) return;
  const th = $('#theme');
  th.hidden = !st.theme; th.querySelector('span').textContent = st.theme || '';
  const v = view();
  const key = v.key || JSON.stringify([st.phase, st.stage, st.idx, st.target, st.notice, st.voteNo, st.items, st.res, st.words, st.guess, st.end, st.players.map(p => [p.char, p.alive]), Object.keys(st.drawings || {})]);
  if (key !== lastKey) {
    lastKey = key;
    $('#stage').innerHTML = v.html;
  }
  $('#footer').innerHTML = footer() + (v.act ? `<div class="actions">${v.act}</div>` : '');
  tick();
}
boot();
</script>
</body>
</html>
